// ══════════════════════════════════════════════════════════════════════════════
// FATUM — app/build.gradle  (versión corregida)
// Fixes: [1] plugin GMS añadido  [2] applicationIdSuffix eliminado
//        [3] bloques packaging fusionados
// ══════════════════════════════════════════════════════════════════════════════
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'   // [FIX 1] — procesa google-services.json
}

android {
    namespace 'com.fatum'
    compileSdk 35

    defaultConfig {
        applicationId "com.fatum"
        minSdk 26          // Android 8.0+ (UsageStatsManager requires 26+)
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables { useSupportLibrary true }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // applicationIdSuffix REMOVED: ".debug" changes the package to com.fatum.debug,
            // which does NOT match com.fatum registered in google-services.json.
            // Google Play Services would fail to initialize and crash the app on startup.
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/DEPENDENCIES'
        }
    }
}

// ── Versions ────────────────────────────────────────────────────────────────
ext {
    compose_bom     = "2024.09.02"
    room_version    = "2.6.1"
    hilt_version    = "2.50"
    lifecycle_ver   = "2.7.0"
    nav_version     = "2.7.7"
    glance_version  = "1.0.0"
    work_version    = "2.9.0"
    gplay_version   = "21.0.0"
}

dependencies {
    // ── Core ──────────────────────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // ── Compose BOM ───────────────────────────────────────────────────────
    implementation platform("androidx.compose:compose-bom:${compose_bom}")
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.lifecycle:lifecycle-process:2.10.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // ── Navigation ────────────────────────────────────────────────────────
    implementation "androidx.navigation:navigation-compose:${nav_version}"
    implementation "androidx.hilt:hilt-navigation-compose:1.1.0"

    // ── Lifecycle + ViewModel ─────────────────────────────────────────────
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:${lifecycle_ver}"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:${lifecycle_ver}"

    // ── Room Database ─────────────────────────────────────────────────────
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // ── Hilt DI ───────────────────────────────────────────────────────────
    implementation "com.google.dagger:hilt-android:${hilt_version}"
    ksp "com.google.dagger:hilt-android-compiler:${hilt_version}"

    // ── WorkManager ───────────────────────────────────────────────────────
    implementation "androidx.work:work-runtime-ktx:${work_version}"
    implementation "androidx.hilt:hilt-work:1.1.0"
    ksp "androidx.hilt:hilt-compiler:1.1.0"

    // ── Glance (Widgets) ──────────────────────────────────────────────────
    implementation "androidx.glance:glance-appwidget:${glance_version}"
    implementation "androidx.glance:glance-material3:${glance_version}"

    // ── Google APIs ───────────────────────────────────────────────────────
    implementation "com.google.android.gms:play-services-auth:${gplay_version}"
    implementation 'com.google.apis:google-api-services-calendar:v3-rev20231123-2.0.0'
    implementation 'com.google.apis:google-api-services-drive:v3-rev20231128-2.0.0'
    implementation 'com.google.api-client:google-api-client-android:2.2.0'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.34.1'
    implementation 'com.google.http-client:google-http-client-gson:1.44.1'
    implementation(platform("com.google.firebase:firebase-bom:32.8.1"))
    implementation("com.google.firebase:firebase-analytics")

    // ── DataStore (Preferences) ───────────────────────────────────────────
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    // ── Serialization ─────────────────────────────────────────────────────
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'

    // ── Coroutines ────────────────────────────────────────────────────────
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // ── Tests ─────────────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform("androidx.compose:compose-bom:${compose_bom}")
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    implementation 'com.google.android.material:material:1.11.0'
}
